name: Release ESP32 firmware

# Builds the two ESP32 firmwares in the suite and publishes them together:
#   * W1VE ESP32 Player (esp32s3) for 4 MB, 8 MB, and 16 MB flash sizes, in w1ve-player-esp32/
#   * W1VE Touch Keyer (esp32c6, 8 MB) in touch-keyer/
# Each produces a single merged flashable image, all are attached to the GitHub Release, and one
# ESP Web Tools site is deployed to GitHub Pages: the Player installer at the root and the Touch
# Keyer installer under /touch-keyer/. A single pages job keeps the one Pages site consistent
# (two separate deploy-pages calls would race and clobber each other).
#
# Triggered by a version tag (v0.1.0, v0.2.0, ...). Also runnable on demand to test.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # attach firmware to the GitHub Release
  pages: write      # deploy the web installer
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: esp32-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── W1VE ESP32 Player (esp32s3), one build per flash size ───────────────────────────────────
  build-player:
    name: Build Player firmware (${{ matrix.flash }} flash)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flash: "4MB"
            partitions: partitions.4mb.csv
          - flash: "8MB"
            partitions: partitions.8mb.csv
          - flash: "16MB"
            partitions: partitions.16mb.csv
    steps:
      - uses: actions/checkout@v4

      # Select the partition table for this flash size and align sdkconfig flash settings.
      # We write a per-build sdkconfig.defaults overlay so the official ESP-IDF container
      # picks up the right flash size and partition CSV without editing tracked defaults.
      - name: Configure flash size
        working-directory: w1ve-player-esp32
        run: |
          size_num="${{ matrix.flash }}"
          size_num="${size_num%MB}"
          cp "${{ matrix.partitions }}" partitions.csv
          cat > sdkconfig.ci <<EOF
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
          CONFIG_HTTPD_WS_SUPPORT=y
          CONFIG_LWIP_SO_REUSE=y
          CONFIG_LWIP_SO_REUSE_RXTOALL=y
          CONFIG_MBEDTLS_HARDWARE_SHA=y
          CONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT=y
          CONFIG_FREERTOS_HZ=1000
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
          CONFIG_ESPTOOLPY_FLASHSIZE_${size_num}MB=y
          CONFIG_ESPTOOLPY_FLASHSIZE="${{ matrix.flash }}"
          CONFIG_ESPTOOLPY_HEADER_FLASHSIZE_UPDATE=y
          EOF
          # The CI overlay replaces the tracked 16MB defaults for this build.
          cp sdkconfig.ci sdkconfig.defaults
          rm -f sdkconfig

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3     # stable release line available in the CI action
          target: esp32s3
          path: w1ve-player-esp32

      # Produce a single merged image flashable at offset 0x0 with one esptool command.
      - name: Merge flashable image
        working-directory: w1ve-player-esp32
        run: |
          pip install --quiet esptool
          size_num="${{ matrix.flash }}"; size_num="${size_num%MB}"
          outdir="$GITHUB_WORKSPACE/esp32-dist/${{ matrix.flash }}"
          mkdir -p "$outdir"
          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size "${{ matrix.flash }}" \
            -o "$outdir/w1ve-esp32-player-${{ matrix.flash }}-merged.bin" \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0x10000 build/w1ve_player_esp32.bin
          # Keep the individual images too, for advanced users.
          cp build/bootloader/bootloader.bin "$outdir/"
          cp build/partition_table/partition-table.bin "$outdir/"
          cp build/w1ve_player_esp32.bin "$outdir/"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.flash }}
          path: esp32-dist/${{ matrix.flash }}

  # ─── W1VE Touch Keyer (esp32c6, 8 MB) ────────────────────────────────────────────────────────
  build-touch-keyer:
    name: Build Touch Keyer firmware (esp32c6, 8 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tracked sdkconfig.defaults already targets esp32c6 at 8 MB with the custom partition
      # table, so no per-build overlay is needed. Remove any stray generated sdkconfig.
      - name: Clean generated config
        working-directory: touch-keyer
        run: rm -f sdkconfig

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3     # matches the project's local toolchain (v5.3.4)
          target: esp32c6
          path: touch-keyer

      - name: Merge flashable image
        working-directory: touch-keyer
        run: |
          pip install --quiet esptool
          outdir="$GITHUB_WORKSPACE/touch-keyer-dist"
          mkdir -p "$outdir"
          python -m esptool --chip esp32c6 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            -o "$outdir/w1ve-touch-keyer-8MB-merged.bin" \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0x10000 build/w1ve-touch-keyer.bin
          cp build/bootloader/bootloader.bin "$outdir/"
          cp build/partition_table/partition-table.bin "$outdir/"
          cp build/w1ve-touch-keyer.bin "$outdir/"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: touch-keyer-firmware
          path: touch-keyer-dist

  # ─── Attach every merged image (both products) to the GitHub Release (tag builds only) ───────
  release:
    needs: [build-player, build-touch-keyer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: esp32-*
          path: esp32-dist
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: touch-keyer-firmware
          path: touch-keyer-dist
      - name: Attach firmware to release
        uses: softprops/action-gh-release@v2
        with:
          # The Touch Keyer documentation rides along as the release notes body; the Player
          # firmware and both products' images are attached as assets.
          body_path: touch-keyer/docs/release-notes.md
          append_body: true
          files: |
            esp32-dist/**/w1ve-esp32-player-*-merged.bin
            touch-keyer-dist/w1ve-touch-keyer-8MB-merged.bin
            touch-keyer/README.md
            touch-keyer/CONTEXT.md
            touch-keyer/WAN.md

  # ─── One Pages deploy for both installers: Player at the root, Touch Keyer under /touch-keyer/ ─
  pages:
    needs: [build-player, build-touch-keyer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: esp32-*
          path: downloaded
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: touch-keyer-firmware
          path: downloaded-touch-keyer
      - name: Assemble web installers
        run: |
          site="$GITHUB_WORKSPACE/_site"
          version="${GITHUB_REF_NAME#v}"

          # ── ESP32 Player at the site root (unchanged layout) ──
          mkdir -p "$site/firmware/4MB" "$site/firmware/8MB" "$site/firmware/16MB"
          cp downloaded/esp32-4MB/w1ve-esp32-player-4MB-merged.bin   "$site/firmware/4MB/firmware.bin"
          cp downloaded/esp32-8MB/w1ve-esp32-player-8MB-merged.bin   "$site/firmware/8MB/firmware.bin"
          cp downloaded/esp32-16MB/w1ve-esp32-player-16MB-merged.bin "$site/firmware/16MB/firmware.bin"
          cp w1ve-player-esp32/web-installer/index.html "$site/index.html"
          for s in 4MB 8MB 16MB; do
            sed "s/__FLASH__/$s/g" w1ve-player-esp32/web-installer/manifest.template.json \
              > "$site/firmware/$s/manifest.json"
          done

          # ── Touch Keyer under /touch-keyer/ ──
          mkdir -p "$site/touch-keyer/firmware"
          cp downloaded-touch-keyer/w1ve-touch-keyer-8MB-merged.bin "$site/touch-keyer/firmware/firmware.bin"
          cp touch-keyer/web-installer/index.html "$site/touch-keyer/index.html"
          sed "s/__VERSION__/${version}/g" touch-keyer/web-installer/manifest.template.json \
            > "$site/touch-keyer/firmware/manifest.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
