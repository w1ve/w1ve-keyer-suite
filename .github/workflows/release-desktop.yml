name: Release desktop apps

# Builds all five desktop products for Windows-x64, macOS (universal arm64 + x64), Linux-x64
# (.deb + .AppImage), and Raspberry Pi (Linux arm64, .deb + .AppImage), then attaches
# every artifact to a single GitHub Release.
#
# Products and their crates. Three Tauri crates produce five products: two crates build
# TWO binaries each (an Operator and a Player) that share one tauri.conf.json. To bundle
# each binary as a correctly-named installer, those crates are built twice with a small
# --config patch (tauri.operator.conf.json / tauri.player.conf.json) that sets
# mainBinaryName + productName + identifier for the binary being bundled.
#
#   Crate                              Workspace            Product (config patch)          Binary
#   wk-app   (W1VE-Keyer)              W1VE-Keyer           W1VE Keyer (none)               w1ve-keyer
#   wrk-app  (W1VE-Remote-Keyer)       W1VE-Remote-Keyer    W1VE Remote Keyer (operator)    w1ve-remote-keyer
#                                                           W1VE Remote Keyer Player (player) w1ve-remote-keyer-player
#   rwk-app  (repo root)               .                    W1VE Remote Keyer Router (operator) w1ve-krr
#                                                           ...Router Player (player)       w1ve-krp
#
# Triggered by a version tag (v0.1.0, ...). workflow_dispatch builds without publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create/attach to the GitHub Release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Windows: raw single-file .exe per binary. A plain `cargo build -p <pkg>`
  # produces a standalone .exe for every [[bin]] in the crate (both the Operator
  # and the Player), so no per-binary config patch is needed here — we just
  # collect every w1ve-*.exe.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 — ${{ matrix.app.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: "W1VE Keyer",        workspace: "W1VE-Keyer",        pkg: "wk-app",  web: "crates/wk-app/web" }
          - { name: "W1VE Remote Keyer", workspace: "W1VE-Remote-Keyer", pkg: "wrk-app", web: "crates/wrk-app/web" }
          - { name: "W1VE Router",       workspace: ".",                 pkg: "rwk-app", web: "rwk-app/web" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app.workspace }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build web bundle
        working-directory: ${{ matrix.app.workspace }}/${{ matrix.app.web }}
        run: npm ci && npm run build

      - name: Build release binaries
        working-directory: ${{ matrix.app.workspace }}
        run: cargo build --release --features custom-protocol -p ${{ matrix.app.pkg }}

      - name: Collect executables
        shell: pwsh
        working-directory: ${{ matrix.app.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Get-ChildItem target\release -Filter *.exe |
            Where-Object { $_.Name -like 'w1ve-*.exe' } |
            ForEach-Object { Copy-Item $_.FullName "$env:GITHUB_WORKSPACE\dist\" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.app.pkg }}
          path: dist/*.exe

  # ---------------------------------------------------------------------------
  # macOS: signed + notarized .dmg per product (arm64 + x64). Each matrix row is
  # one product; paired crates appear twice with their operator/player patch.
  # Signing/notarization secrets are optional: absent -> unsigned .dmg.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS universal — ${{ matrix.product.name }}
    runs-on: macos-latest
    # Secrets can't be used in a step `if:`, but they can in env. Capture whether an Apple
    # signing cert is configured once here; the build steps gate on this env value.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        # One universal (arm64 + x64) .dmg per product. A single macOS job per product keeps
        # the macOS runner queue small enough to avoid cancellations under GitHub's limited
        # macOS concurrency, and gives users one .dmg that runs on both Intel and Apple Silicon.
        product:
          - { name: "W1VE Keyer",                     workspace: "W1VE-Keyer",        confdir: "crates/wk-app",  web: "crates/wk-app/web", config: "", slug: "w1ve-keyer" }
          - { name: "W1VE Remote Keyer",              workspace: "W1VE-Remote-Keyer", confdir: "crates/wrk-app", web: "crates/wrk-app/web", config: "tauri.operator.conf.json", slug: "w1ve-remote-keyer" }
          - { name: "W1VE Remote Keyer Player",       workspace: "W1VE-Remote-Keyer", confdir: "crates/wrk-app", web: "crates/wrk-app/web", config: "tauri.player.conf.json",   slug: "w1ve-remote-keyer-player" }
          - { name: "W1VE Remote Keyer Router",       workspace: ".",                 confdir: "rwk-app",        web: "rwk-app/web", config: "tauri.operator.conf.json", slug: "w1ve-krr" }
          - { name: "W1VE Remote Keyer Router Player", workspace: ".",                confdir: "rwk-app",        web: "rwk-app/web", config: "tauri.player.conf.json",   slug: "w1ve-krp" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal builds need both architecture targets installed.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.product.workspace }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build web bundle
        working-directory: ${{ matrix.product.workspace }}/${{ matrix.product.web }}
        run: npm ci && npm run build

      # For a universal macOS build, Tauri's bundler copies EVERY [[bin]] the crate declares
      # into the .app, not just mainBinaryName. The paired crates (wrk-app, rwk-app) have a
      # second binary (the Player/Operator sibling) that the universal build would not have
      # produced, so the bundler fails with "Failed to copy binary ... does not exist".
      # Pre-build BOTH binaries for BOTH arches and lipo them into the universal output dir so
      # every declared binary exists before bundling. No-op for the single-binary wk-app.
      - name: Pre-build universal binaries
        working-directory: ${{ matrix.product.workspace }}
        run: |
          set -euo pipefail
          cargo build --release --features custom-protocol --target aarch64-apple-darwin
          cargo build --release --features custom-protocol --target x86_64-apple-darwin
          uni="target/universal-apple-darwin/release"
          mkdir -p "$uni"
          # lipo every real executable the crate produced (w1ve-*, no extension) into the
          # universal dir. Skip .d/.dSYM artifacts; only operate on Mach-O executables.
          for arm in target/aarch64-apple-darwin/release/w1ve-*; do
            [ -f "$arm" ] && [ -x "$arm" ] || continue
            case "$arm" in *.*) continue;; esac
            file "$arm" | grep -q 'Mach-O' || continue
            name=$(basename "$arm")
            intel="target/x86_64-apple-darwin/release/$name"
            if [ -f "$intel" ]; then
              lipo -create "$arm" "$intel" -output "$uni/$name"
              echo "lipo: $name"
            fi
          done

      # Two build paths. When the APPLE_CERTIFICATE secret is present, build signed +
      # notarized; otherwise build unsigned. Passing empty Apple env vars makes the Tauri
      # bundler try (and fail) to codesign with a blank certificate, so the signing env is
      # only present on the signed path.
      - name: Build + bundle (signed)
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ${{ matrix.product.workspace }}/${{ matrix.product.confdir }}
          args: >-
            ${{ matrix.product.config != '' && format('--config {0}', matrix.product.config) || '' }}
            --target universal-apple-darwin
            --bundles dmg

      - name: Build + bundle (unsigned)
        if: ${{ env.HAS_APPLE_CERT != 'true' }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ matrix.product.workspace }}/${{ matrix.product.confdir }}
          args: >-
            ${{ matrix.product.config != '' && format('--config {0}', matrix.product.config) || '' }}
            --target universal-apple-darwin
            --bundles dmg

      - name: Collect dmg
        working-directory: ${{ matrix.product.workspace }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . -path "*/release/bundle/dmg/*.dmg" -print0 | while IFS= read -r -d '' f; do
            cp "$f" "$GITHUB_WORKSPACE/dist/${{ matrix.product.slug }}-universal.dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-${{ matrix.product.slug }}
          path: dist/*.dmg

  # ---------------------------------------------------------------------------
  # Linux x64: .deb (Debian/Ubuntu) + .AppImage (portable). One matrix row per
  # product; paired crates build twice via their operator/player config patch.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64 — ${{ matrix.product.name }}
    runs-on: ubuntu-22.04   # oldest supported runner -> widest glibc compatibility
    strategy:
      fail-fast: false
      matrix:
        product:
          - { name: "W1VE Keyer",                      workspace: "W1VE-Keyer",        confdir: "crates/wk-app",  web: "crates/wk-app/web", config: "", slug: "w1ve-keyer" }
          - { name: "W1VE Remote Keyer",               workspace: "W1VE-Remote-Keyer", confdir: "crates/wrk-app", web: "crates/wrk-app/web", config: "tauri.operator.conf.json", slug: "w1ve-remote-keyer" }
          - { name: "W1VE Remote Keyer Player",        workspace: "W1VE-Remote-Keyer", confdir: "crates/wrk-app", web: "crates/wrk-app/web", config: "tauri.player.conf.json",   slug: "w1ve-remote-keyer-player" }
          - { name: "W1VE Remote Keyer Router",        workspace: ".",                 confdir: "rwk-app",        web: "rwk-app/web", config: "tauri.operator.conf.json", slug: "w1ve-krr" }
          - { name: "W1VE Remote Keyer Router Player", workspace: ".",                 confdir: "rwk-app",        web: "rwk-app/web", config: "tauri.player.conf.json",   slug: "w1ve-krp" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.product.workspace }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libasound2-dev pkg-config build-essential \
            file desktop-file-utils libfuse2

      - name: Build web bundle
        working-directory: ${{ matrix.product.workspace }}/${{ matrix.product.web }}
        run: npm ci && npm run build

      - name: Build + bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ matrix.product.workspace }}/${{ matrix.product.confdir }}
          args: >-
            ${{ matrix.product.config != '' && format('--config {0}', matrix.product.config) || '' }}
            --bundles deb,appimage

      - name: Collect bundles
        working-directory: ${{ matrix.product.workspace }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . \( -path '*/bundle/deb/*.deb' -o -path '*/bundle/appimage/*.AppImage' \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ matrix.product.slug }}
          path: dist/*

  # ---------------------------------------------------------------------------
  # Raspberry Pi (Linux arm64): .deb + .AppImage, native arm64 runner. RasPi OS
  # is Debian-based, so .deb is the natural install (no chmod +x). Same per-
  # product matrix as linux-x64.
  # ---------------------------------------------------------------------------
  raspi:
    name: Raspberry Pi arm64 — ${{ matrix.product.name }}
    runs-on: ubuntu-22.04-arm   # free arm64 runner; oldest -> widest glibc compatibility
    strategy:
      fail-fast: false
      matrix:
        product:
          - { name: "W1VE Keyer",                      workspace: "W1VE-Keyer",        confdir: "crates/wk-app",  web: "crates/wk-app/web", config: "", slug: "w1ve-keyer" }
          - { name: "W1VE Remote Keyer",               workspace: "W1VE-Remote-Keyer", confdir: "crates/wrk-app", web: "crates/wrk-app/web", config: "tauri.operator.conf.json", slug: "w1ve-remote-keyer" }
          - { name: "W1VE Remote Keyer Player",        workspace: "W1VE-Remote-Keyer", confdir: "crates/wrk-app", web: "crates/wrk-app/web", config: "tauri.player.conf.json",   slug: "w1ve-remote-keyer-player" }
          - { name: "W1VE Remote Keyer Router",        workspace: ".",                 confdir: "rwk-app",        web: "rwk-app/web", config: "tauri.operator.conf.json", slug: "w1ve-krr" }
          - { name: "W1VE Remote Keyer Router Player", workspace: ".",                 confdir: "rwk-app",        web: "rwk-app/web", config: "tauri.player.conf.json",   slug: "w1ve-krp" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.product.workspace }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libasound2-dev pkg-config build-essential \
            file desktop-file-utils libfuse2

      - name: Build web bundle
        working-directory: ${{ matrix.product.workspace }}/${{ matrix.product.web }}
        run: npm ci && npm run build

      - name: Build + bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ matrix.product.workspace }}/${{ matrix.product.confdir }}
          args: >-
            ${{ matrix.product.config != '' && format('--config {0}', matrix.product.config) || '' }}
            --bundles deb,appimage

      - name: Collect bundles (tag arm64)
        working-directory: ${{ matrix.product.workspace }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . \( -path '*/bundle/deb/*.deb' -o -path '*/bundle/appimage/*.AppImage' \) \
            -print0 | while IFS= read -r -d '' f; do
              name=$(basename "$f")
              stem="${name%.*}"; ext="${name##*.}"
              cp "$f" "$GITHUB_WORKSPACE/dist/${stem}-arm64.${ext}"
            done

      - uses: actions/upload-artifact@v4
        with:
          name: raspi-arm64-${{ matrix.product.slug }}
          path: dist/*

  # ---------------------------------------------------------------------------
  # Publish everything to the GitHub Release (tag builds only).
  # ---------------------------------------------------------------------------
  release:
    needs: [windows, macos, linux, raspi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Need the repo on disk for the release-notes body file.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          body_path: docs/release-notes.md
          prerelease: true
          fail_on_unmatched_files: false
