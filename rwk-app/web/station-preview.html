    <title>RWK Station (preview)</title>

  <body>
    <div id="root"></div>
    <script>
      // Temporary stub of the Tauri IPC bridge: makes main.jsx mount StationApp.
      const replies = {
        station_app_role: "station",
        station_serial_ports: ["COM3", "COM4"],
        station_regenerate_token: "185a37c0a02e",
      };
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd) => (cmd in replies ? replies[cmd] : null),
        transformCallback: () => 0,
        unregisterCallback: () => {},
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
