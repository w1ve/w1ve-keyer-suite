[workspace]
resolver = "2"
members = ["crates/wk-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gerry Hull, W1VE"]
repository = "https://github.com/w1ve/w1ve-keyer"

[workspace.dependencies]
# The shared engine lives in the Keyer-Router project. This app reuses it wholesale (keyer
# timing, serial keying, sidetone, paddle input, WinKeyer host decode) rather than forking
# anything — the standalone Keyer is the Remote Keyer's keying path with the network removed.
#
# The engine is the suite's `common/rwk-core/` (W1VE-Keyer-Suite layout).
rwk-core = { path = "../common/rwk-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serialport = "4"

[profile.release]
lto = true
codegen-units = 1
