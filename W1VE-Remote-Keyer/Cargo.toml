[workspace]
resolver = "2"
members = ["crates/wrk-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gerry Hull, W1VE"]
repository = "https://github.com/w1ve/w1ve-remote-keyer"

[workspace.dependencies]
# The shared engine lives in the sibling Keyer-Router project. This app reuses it wholesale
# (WireGuard tunnel, relay, keyer timing, serial keying, sidetone, paddle input) rather than
# forking any of it — the Remote Keyer is the Keyer-Router's keying path without the router.
#
# REQUIRED LAYOUT: this is a relative path, so the RWK-Rust repo must be checked out as a
# sibling of this repo under the same parent directory, i.e.
#   <parent>/RWK-Rust/rust/crates/rwk-core   (the engine)
#   <parent>/W1VE-Remote-Keyer               (this repo)
# The macOS provisioning script (RWK-Rust/docs/mac/provision.sh) clones both into one parent
# so this resolves automatically. When the three projects are consolidated into the
# w1ve-keyer-suite workspace, this becomes an in-workspace path and the sibling requirement
# goes away.
rwk-core = { path = "../RWK-Rust/rust/crates/rwk-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
